# @package _global_

defaults:
  - default.yaml

# total steps, log steps, val_steps, num_workers, LR, batch size
GENERAL:
  TOTAL_STEPS: 1_400_000 
  LOG_STEPS: 1
  VAL_STEPS: 1
  VAL_EPOCHS: 100
  CHECKPOINT_EPOCHS: 20
  CHECKPOINT_SAVE_TOP_K: 1
  NUM_WORKERS: 64
  PREFETCH_FACTOR: 2

LOSS_WEIGHTS:
  AVES:
    KEYPOINTS_3D: 0.05
    KEYPOINTS_2D: 0.01
    GLOBAL_ORIENT: 0.001
    POSE: 0.001
    BETAS: 0.0005
    BONE: 0.002
    ADVERSARIAL: 0.
    MASK: 0.02
    POSE_RE: 0.05
    BETAS_RE: 0.001
    BONE_RE: 0.1
  SMAL: 
    KEYPOINTS_3D: 0.05
    KEYPOINTS_2D: 0.01
    GLOBAL_ORIENT: 0.001
    POSE: 0.001
    BETAS: 0.0005
    ADVERSARIAL: 0
    MASK: 0.0
  VAREN:
    KEYPOINTS_3D: 0.05
    KEYPOINTS_2D: 0.01
    # direct supervision on the predicted parameters (see compute_varen_loss).
    # keypoints alone constrain only 43 of 13873 vertices, which let betas blow
    # up and crumple the mesh. Deliberately ~20-40x the SMAL/AVES weights above:
    # those assume a shape/pose prior alongside and mostly-unlabelled real images,
    # whereas every horse sample is synthetic with exact ground-truth parameters,
    # so this is direct supervision and can be weighted accordingly. Measured: at
    # the SMAL weights betas stalls ~1.8x above ground truth, at these it converges
    # onto it (see .agent/Checks.md).
    GLOBAL_ORIENT: 0.02
    BODY_POSE: 0.02
    BETAS: 0.02
    SCALE: 0.02  # direct pelvis-relative-size loss -- generated horses were consistently too small
  SUPCON: 0.0005

TRAIN:
  LR: 1e-4  # was 1.25e-6, 80x too low to converge in a practical step budget -- see test_camera_scale_overfit.py
  WEIGHT_DECAY: 1e-4
  BATCH_SIZE: 64
  LOSS_REDUCTION: mean
  NUM_TRAIN_SAMPLES: 64
  NUM_TEST_SAMPLES: 2
  POSE_2D_NOISE_RATIO: 0.01
  SMPL_PARAM_NOISE_RATIO: 0.005

MODEL:
  IMAGE_SIZE: 256
  IMAGE_MEAN: [0.485, 0.456, 0.406]
  IMAGE_STD: [0.229, 0.224, 0.225]
  BACKBONE:
    USE_CLS: true
    TYPE: vithmoe
    PRETRAINED_WEIGHTS: data/vitmoe.pth
    # Which parts of the ViT-MoE backbone stay trainable. All off by default
    # (fully trainable, matches prior behavior) -- override per-run, e.g.
    # `+experiment.MODEL.BACKBONE.FROZEN_STAGES=8`.
    FROZEN_STAGES: -1     # -1 = nothing frozen; N = freeze patch_embed + blocks[1..N] (block 0 stays trainable)
    FREEZE_ATTN: false    # freeze every block's attention + its preceding norm1, all 32 blocks
    FREEZE_FFN: false     # freeze patch_embed, pos_embed, and every block's MLP + its preceding norm2
  AVES_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    IEF_ITERS: 1
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      norm: layer
      context_dim: 1280
  SMAL_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    IEF_ITERS: 1
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      norm: layer
      context_dim: 1280
  VAREN_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    IEF_ITERS: 1
    TRANSFORMER_INPUT: zero
    JOINT_REP: 6d
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.0
      emb_dropout: 0.0
      norm: layer
      context_dim: 1280
  CLASS_TOKEN_HEAD:
    embed_dim: 1280
    hidden_dim: 4096 
    output_dim: 256 
    num_layers: 3 
    last_bn: true

DATASETS:
  CUB:
    ROOT_IMAGE: path/to/CUB
    ANNOTATIONS: 
      TRAIN: path/to/train.mat
      TEST: path/to/test.mat
    JSON_FILE:
      TEST: path/to/test.json
    WEIGHT: 0.45
  ANIMAL3D:
    ROOT_IMAGE: path/to/animal3d
    JSON_FILE:
      TRAIN: path/to/train.json
      TEST: path/to/test.json
    WEIGHT: 1
  CTRLAVES3D:
    ROOT_IMAGE: path/to/ctrlaves3d
    JSON_FILE:
      TRAIN: path/to/train.json
      TEST: path/to/test.json
    WEIGHT: 1
  HORSE:
    ROOT_IMAGE: path/to/horse
    JSON_FILE:
      TRAIN: path/to/horse/train.json
      TEST: path/to/horse/test.json
    WEIGHT: 0

AVES:
  FOCAL_LENGTH: 2167
  MODEL_PATH: data/aves/aves_high_res.pt
  POSE_PRIOR_PATH: data/aves/aves_high_res.pt
  NUM_JOINTS: 24

SMAL:
  FOCAL_LENGTH: 1000
  MODEL_PATH: data/smal/my_smpl_00781_4_all.pkl
  SHAPE_PRIOR_PATH: data/smal/my_smpl_data_00781_4_all.pkl
  POSE_PRIOR_PATH: data/smal/walking_toy_symmetric_pose_prior_with_cov_35parts.pkl
  NUM_JOINTS: 34

VAREN:
  FOCAL_LENGTH: 5000
  MODEL_PATH: /lustre/home/okumar/VAREN/models
  NUM_JOINTS: 37
  NUM_BETAS: 39
  USE_MUSCLE_DEFORMATIONS: false
  EXT: pkl

EXTRA:
  NUM_LOG_IMAGES: 4
  NUM_LOG_SAMPLES_PER_IMAGE: 4
  PELVIS_IND: 0

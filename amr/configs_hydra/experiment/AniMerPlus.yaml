# @package _global_

defaults:
  - default.yaml

# total steps, log steps, val_steps, num_workers, LR, batch size
GENERAL:
  TOTAL_STEPS: 1_400_000 
  LOG_STEPS: 1
  VAL_STEPS: 1
  VAL_EPOCHS: 100
  CHECKPOINT_EPOCHS: 20
  CHECKPOINT_SAVE_TOP_K: 1
  NUM_WORKERS: 64
  PREFETCH_FACTOR: 2

LOSS_WEIGHTS:
  VAREN:
    KEYPOINTS_3D: 0.05
    KEYPOINTS_2D: 0.05
    JOINTS_3D: 0.05
    JOINTS_2D: 0.05
    VERTICES: 0.003
    GLOBAL_ORIENT: 0.02
    BODY_POSE: 0.02
    BETAS: 0.02
    SCALE: 0.05
    TRANSL: 0.05

TRAIN:
  LR: 1e-4  
  WARMUP_STEPS: 500 
  WEIGHT_DECAY: 1e-3  
  BACKBONE_LR_GROUPS:
    - {max_block: 10, lr_mult: 0.01}
    - {max_block: 25, lr_mult: 0.1}
  BATCH_SIZE: 4
  LOSS_REDUCTION: mean
  NUM_TRAIN_SAMPLES: 64
  NUM_TEST_SAMPLES: 2
  POSE_2D_NOISE_RATIO: 0.01
  SMPL_PARAM_NOISE_RATIO: 0.005

MODEL:
  IMAGE_SIZE: 256
  IMAGE_MEAN: [0.485, 0.456, 0.406]
  IMAGE_STD: [0.229, 0.224, 0.225]
  BACKBONE:
    TYPE: vithmoe
    PRETRAINED_WEIGHTS: data/vitmoe.pth
    FROZEN_STAGES: -1     # -1 = nothing frozen; N = freeze patch_embed + blocks[1..N] (block 0 stays trainable)
    FREEZE_ATTN: false    # freeze every block's attention + its preceding norm1, all 32 blocks
    FREEZE_FFN: false     # freeze patch_embed, pos_embed, and every block's MLP + its preceding norm2
  VAREN_HEAD:
    TYPE: transformer_decoder
    IN_CHANNELS: 2048
    IEF_ITERS: 1
    TRANSFORMER_INPUT: zero
    JOINT_REP: 6d
    TRANSFORMER_DECODER:
      depth: 6
      heads: 8
      mlp_dim: 1024
      dim_head: 64
      dropout: 0.1  # was 0.0 -- model was overfitting the small horse set
      emb_dropout: 0.0  # NOT raised: this head uses num_tokens=1, and TransformerDecoder's
      # default emb_dropout_type='drop' drops whole TOKENS (DropTokenDropout), not values --
      # with a single token, any emb_dropout>0 has a per-step chance of dropping it entirely,
      # producing a zero-length sequence that crashes in decpose() a few steps in.
      norm: layer
      context_dim: 1280
  CLASS_TOKEN_HEAD:
    embed_dim: 1280
    hidden_dim: 4096 
    output_dim: 256 
    num_layers: 3 
    last_bn: true

DATASETS:
  HORSE:
    ROOT_IMAGE: path/to/horse
    JSON_FILE:
      TRAIN: path/to/horse/train.json
      TEST: path/to/horse/test.json
    WEIGHT: 0

VAREN:
  FOCAL_LENGTH: 5000
  MODEL_PATH: /lustre/home/okumar/VAREN/models
  NUM_JOINTS: 37
  NUM_BETAS: 39
  USE_MUSCLE_DEFORMATIONS: false
  EXT: pkl

EXTRA:
  NUM_LOG_IMAGES: 4
  NUM_LOG_SAMPLES_PER_IMAGE: 4
  PELVIS_IND: 0
